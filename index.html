<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B80F22">
<title>OBCH | مدیریت قیمت محصولات</title>
<style>
@font-face{
  font-family:'IRANSansX';
  src:url('IRANSansX-Black.ttf') format('truetype');
  font-weight:900;
  font-style:normal;
  font-display:swap;
}

:root{
  --red:#B80F22;
  --red-dark:#8F0D1B;
  --red-soft:#FCEBED;
  --silver-1:#F8F8F8;
  --silver-2:#ECECEF;
  --silver-3:#DADAE0;
  --silver-4:#B9BCC6;
  --ink:#21242B;
  --ink-soft:#5E6470;
  --white:#FFFFFF;
  --green:#1F9D55;
  --green-soft:#EAF8F0;
  --danger:#C91F37;
  --danger-soft:#FCECEF;
  --shadow:0 18px 48px rgba(30,33,40,.12);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:'IRANSansX',Tahoma,Arial,sans-serif;
}
body{
  color:var(--ink);
  background:
    radial-gradient(circle at top right, rgba(184,15,34,.09), transparent 26%),
    radial-gradient(circle at bottom left, rgba(180,180,188,.26), transparent 28%),
    linear-gradient(145deg,#FCFCFD 0%,#F2F3F6 50%,#FBFBFC 100%);
  overflow-x:hidden;
}

button,input{font:inherit;font-family:'IRANSansX',Tahoma,Arial,sans-serif}
button{cursor:pointer}

.wrap{max-width:1140px;margin:auto;padding:18px}

.textSplash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%, rgba(184,15,34,.16), transparent 32%),
    linear-gradient(140deg,#E9E9ED 0%,#C9CBD2 45%,#9DA3AE 100%);
  animation:splashOut .65s ease 2.6s forwards;
}
.textSplashBox{text-align:center;color:var(--ink);padding:24px}
.textSplashEn{
  font-size:34px;
  font-weight:900;
  letter-spacing:8px;
  color:var(--red);
  opacity:0;
  transform:translateY(14px);
  animation:introUp .6s ease .15s forwards;
}
.textSplashLine{
  width:0;height:3px;margin:16px auto 0;border-radius:99px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  box-shadow:0 0 14px rgba(184,15,34,.24);
  animation:introLine .6s ease .6s forwards;
}
.textSplashWelcome{
  margin-top:15px;
  font-size:15px;
  font-weight:700;
  color:#5A5F69;
  opacity:0;
  animation:introFade .5s ease 1s forwards;
}
@keyframes introUp{to{opacity:1;transform:translateY(0)}}
@keyframes introLine{to{width:210px}}
@keyframes introFade{to{opacity:1}}
@keyframes splashOut{
  0%{opacity:1;visibility:visible;pointer-events:auto}
  99%{opacity:0;visibility:visible;pointer-events:none}
  100%{opacity:0;visibility:hidden;pointer-events:none}
}

.header{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  padding:26px 24px;
  margin-bottom:16px;
  color:var(--white);
  background:
    linear-gradient(135deg, rgba(34,37,44,.92), rgba(95,101,112,.84)),
    linear-gradient(135deg, #F3F3F6, #C6CAD3);
  border:1px solid rgba(255,255,255,.48);
  box-shadow:0 22px 60px rgba(33,36,43,.18);
}
.header::before{
  content:"";
  position:absolute;
  inset:auto -40px -70px auto;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle, rgba(184,15,34,.95) 0%, rgba(184,15,34,.35) 42%, transparent 72%);
  filter:blur(8px);
  opacity:.72;
}
.header::after{
  content:"";
  position:absolute;
  inset:-40px auto auto -40px;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.16) 0%, transparent 70%);
}
.brand{position:relative;z-index:1;font-size:33px;font-weight:900;letter-spacing:3px}
.subtitle{position:relative;z-index:1;margin-top:8px;font-size:14px;opacity:.96}
.brandTag{
  position:relative;z-index:1;display:inline-flex;gap:8px;align-items:center;
  margin-top:14px;padding:8px 14px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
  font-size:12px;
}

.card{
  background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(248,248,249,.92));
  border:1px solid var(--silver-3);
  border-radius:24px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}
label{display:block;font-size:14px;font-weight:700;margin-bottom:8px;color:#383D46}
input{
  width:100%;
  border:1px solid var(--silver-4);
  border-radius:16px;
  padding:13px 14px;
  background:#fff;
  color:var(--ink);
  outline:none;
  transition:border-color .2s ease, box-shadow .2s ease, transform .15s ease;
}
input:focus{
  border-color:var(--red);
  box-shadow:0 0 0 4px rgba(184,15,34,.10);
}

.rateRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

.btn{
  border:0;
  border-radius:15px;
  padding:11px 16px;
  font-weight:700;
  transition:transform .15s ease,box-shadow .2s ease,opacity .2s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}

.primary{
  color:#fff;
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  box-shadow:0 10px 22px rgba(184,15,34,.22);
}
.secondary{
  color:#2D323B;
  background:linear-gradient(135deg,#FFFFFF,#ECECEF);
  border:1px solid var(--silver-3);
  box-shadow:0 8px 18px rgba(80,85,95,.08);
}
.danger{
  color:var(--danger);
  background:var(--danger-soft);
  border:1px solid rgba(201,31,55,.20);
}
.small{padding:8px 12px;font-size:13px}
.editBtn{
  background:var(--green-soft);
  color:var(--green);
  border:1px solid rgba(31,157,85,.22);
}

.note{font-size:12px;color:var(--ink-soft);margin-top:7px}

.tableWrap{
  overflow:auto;
  border:1px solid var(--silver-3);
  border-radius:18px;
  background:#fff;
}
table{width:100%;border-collapse:collapse;min-width:920px}
th,td{
  padding:13px 10px;
  border-bottom:1px solid #ECECF0;
  white-space:nowrap;
}
th{
  background:linear-gradient(180deg,#FAFAFB,#ECECEF);
  color:#3A3F48;
  font-size:14px;
  text-align:center;
}
td{
  text-align:center;
  background:#fff;
}
tbody tr:hover td{background:#FCF7F8}
td.product{text-align:right;white-space:normal}
tr:last-child td{border-bottom:0}
.empty{text-align:center;color:#737986;padding:30px}

.productThumb{
  width:52px;height:52px;object-fit:cover;border-radius:12px;
  border:1px solid #DDDDE3;background:#fff;display:block;margin:auto;
  box-shadow:0 4px 14px rgba(80,85,95,.10);
}
.productThumbPlaceholder{
  display:inline-flex;align-items:center;justify-content:center;
  width:52px;height:52px;border-radius:12px;background:#F4F4F6;color:#8A909D;border:1px solid #E0E0E5;
  margin:auto;font-size:12px
}
.imagePreviewWrap{margin-top:10px;display:flex;justify-content:flex-start}
.imagePreview{
  width:94px;height:94px;object-fit:cover;border-radius:16px;
  border:1px solid #DDDDE3;background:#fff;display:none;box-shadow:0 6px 16px rgba(80,85,95,.11);
}
.imageHint{font-size:12px;color:#717783;margin-top:6px}

.modalBack{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:18px;z-index:20;background:rgba(36,40,48,.40);backdrop-filter:blur(8px);
}
.modalBack.show{display:flex}
.modal{
  width:min(480px,100%);position:relative;
  background:linear-gradient(180deg,#FFFFFF,#F6F6F8);
  border:1px solid #E3E3E8;border-radius:26px;padding:22px;
  box-shadow:0 24px 70px rgba(26,30,38,.18);
}
.modal h2{margin:0 0 16px;color:#343942;font-size:20px}
.close{
  position:absolute;left:14px;top:10px;border:0;background:transparent;
  font-size:28px;color:#7D8390
}
.field{margin-bottom:13px}
.modalActions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.footer{text-align:center;color:#737986;font-size:12px;padding:4px 0 15px}

@media(max-width:700px){
  .wrap{padding:10px}
  .header{padding:21px 18px;border-radius:22px}
  .brand{font-size:28px}
  .rateRow{grid-template-columns:1fr}
  .actions .btn{flex:1}
  .card{border-radius:20px}
}
@media print{
  body{background:#fff;color:#111}
  .textSplash,.rateCard,.actions,.footer,.noPrint,.ops{display:none!important}
  th:nth-child(2),td:nth-child(2){display:none!important}
  .wrap{max-width:none;padding:0}
  .header{background:#fff;color:#111;box-shadow:none;border:0;padding:0 0 10px}
  .header::before,.header::after{display:none}
  .brand{color:var(--red)}
  .subtitle{color:#555}
  .card{border:0;box-shadow:none;padding:0;background:#fff}
  .tableWrap{overflow:visible;border:1px solid #bbb;background:#fff}
  table{min-width:0;width:100%}
  th{background:#eee!important;color:#111}
  td{background:#fff!important}
  th,td{border-color:#bbb;color:#111}
}
</style>
</head>
<body>

<div class="textSplash" aria-hidden="true">
  <div class="textSplashBox">
    <div class="textSplashEn">OBCH</div>
    <div class="textSplashLine"></div>
    <div class="textSplashWelcome">خوش آمدید</div>
  </div>
</div>

<div class="wrap">
  <header class="header">
    <div class="brand">OBCH</div>
    <div class="subtitle">مدیریت و محاسبه قیمت محصولات</div>
    
  </header>

  <section class="card rateCard">
    <div class="rateRow">
      <div>
        <label for="rate">قیمت دلار به تومان</label>
        <input id="rate" type="number" inputmode="numeric" min="0" step="1" value="234000">
      </div>
      <button class="btn secondary" id="settingsBtn" type="button">⚙ تنظیمات رمز</button>
    </div>
    <div class="note">قیمت محصول = قیمت دلاری × نرخ دلار</div>
  </section>

  <section class="card">
    <div class="actions">
      <button class="btn primary" id="addBtn" type="button">＋ افزودن محصول</button>
      <button class="btn secondary" id="pdfBtn" type="button">↓ خروجی PDF لیست</button>
    </div>

    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>ردیف</th>
            <th>تصویر</th>
            <th>محصول</th>
            <th>دلار</th>
            <th>قیمت به تومان</th>
            <th class="ops">عملیات</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">محصولی ثبت نشده است.</div>
    </div>
  </section>

  <div class="footer">اطلاعات، رمز و عکس‌ها در همین مرورگر ذخیره می‌شوند.</div>
</div>

<div class="modalBack" id="productModal">
  <div class="modal">
    <button class="close" data-close="productModal" type="button">×</button>
    <h2 id="productTitle">افزودن محصول</h2>

    <div class="field">
      <label for="nameInput">نام محصول</label>
      <input id="nameInput" type="text" autocomplete="off">
    </div>

    <div class="field">
      <label for="usdInput">قیمت به دلار</label>
      <input id="usdInput" type="number" inputmode="decimal" min="0" step="0.001">
    </div>

    <div class="field">
      <label for="imageInput">عکس محصول</label>
      <input id="imageInput" type="file" accept="image/*">
      <div class="imageHint">عکس در همین مرورگر ذخیره می‌شود.</div>
      <div class="imagePreviewWrap">
        <img id="imagePreview" class="imagePreview" alt="پیش‌نمایش عکس محصول">
      </div>
    </div>

    <div class="modalActions">
      <button class="btn primary" id="saveProduct" type="button">ثبت</button>
      <button class="btn secondary" data-close="productModal" type="button">انصراف</button>
    </div>
  </div>
</div>

<div class="modalBack" id="passwordModal">
  <div class="modal">
    <button class="close" data-close="passwordModal" type="button">×</button>
    <h2>رمز عبور ویرایش</h2>
    <div class="field">
      <label for="passwordInput">رمز فعلی</label>
      <input id="passwordInput" type="password" inputmode="numeric" autocomplete="current-password">
    </div>
    <div class="modalActions">
      <button class="btn primary" id="passwordOk" type="button">تأیید</button>
      <button class="btn secondary" data-close="passwordModal" type="button">انصراف</button>
    </div>
  </div>
</div>

<div class="modalBack" id="deleteModal">
  <div class="modal">
    <button class="close" data-close="deleteModal" type="button">×</button>
    <h2>حذف محصول</h2>
    <div id="deleteMessage" style="line-height:1.9"></div>
    <div class="modalActions">
      <button class="btn danger" id="deleteOk" type="button">حذف</button>
      <button class="btn secondary" data-close="deleteModal" type="button">انصراف</button>
    </div>
  </div>
</div>

<div class="modalBack" id="settingsModal">
  <div class="modal">
    <button class="close" data-close="settingsModal" type="button">×</button>
    <h2>تغییر رمز ویرایش</h2>

    <div class="field">
      <label for="oldPass">رمز فعلی</label>
      <input id="oldPass" type="password" inputmode="numeric" autocomplete="current-password">
    </div>

    <div class="field">
      <label for="newPass">رمز جدید</label>
      <input id="newPass" type="password" inputmode="numeric" autocomplete="new-password">
    </div>

    <div class="field">
      <label for="repeatPass">تکرار رمز جدید</label>
      <input id="repeatPass" type="password" inputmode="numeric" autocomplete="new-password">
    </div>

    <div class="modalActions">
      <button class="btn primary" id="changePass" type="button">ثبت رمز جدید</button>
      <button class="btn secondary" data-close="settingsModal" type="button">انصراف</button>
    </div>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const PRODUCTS_KEY = "obch_products_v4";
const RATE_KEY = "obch_rate_v4";
const PASS_KEY = "obch_edit_password_v4";
const DEFAULT_RATE = 234000;
const DEFAULT_PASS = "1234";

const defaultProducts = [
  ["محافظ ولتاژ تک‌فاز 63 آمپر",0],
  ["محافظ ولتاژ تک‌فاز 40 آمپر",0],
  ["محافظ ولتاژ سه‌فاز 80 آمپر",0],
  ["محافظ ولتاژ تک‌فاز 80 آمپر",0]
];

let products = loadProducts();
let editIndex = -1;
let pendingEditIndex = -1;
let deleteIndex = -1;
let currentImageData = "";

function loadProducts(){
  try{
    const raw = localStorage.getItem(PRODUCTS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        return parsed.map(p=>({
          name:p.name||"",
          usd:Number(p.usd)||0,
          image:p.image||""
        }));
      }
    }
  }catch(e){}
  return defaultProducts.map(x=>({name:x[0], usd:x[1], image:""}));
}
function saveProducts(){ localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products)); }
function getRate(){ return Number($("rate").value) || 0; }
function formatNumber(n){ return Number(n).toLocaleString("fa-IR"); }
function formatPdfNumber(n){
  const en = Number(n).toLocaleString("en-US");
  const faDigits = "۰۱۲۳۴۵۶۷۸۹";
  return en.replace(/\d/g, d => faDigits[d]);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
function updateImagePreview(src){
  const img = $("imagePreview");
  if(src){
    img.src = src;
    img.style.display = "block";
  }else{
    img.removeAttribute("src");
    img.style.display = "none";
  }
}
function openModal(id){ $(id).classList.add("show"); }
function closeModal(id){ $(id).classList.remove("show"); }

function render(){
  const body = $("tbody");
  body.innerHTML = "";
  $("empty").style.display = products.length ? "none" : "block";

  products.forEach((p,i)=>{
    const price = Math.round(Number(p.usd) * getRate());
    const tr = document.createElement("tr");
    const imageCell = p.image
      ? '<img class="productThumb" src="'+p.image+'" alt="عکس محصول">'
      : '<span class="productThumbPlaceholder">—</span>';

    tr.innerHTML =
      "<td>"+formatNumber(i+1)+"</td>"+
      "<td>"+imageCell+"</td>"+
      '<td class="product">'+esc(p.name)+"</td>"+
      "<td>"+formatNumber(p.usd)+"</td>"+
      "<td>"+formatNumber(price)+"</td>"+
      '<td class="ops">'+
        '<button class="btn small editBtn" type="button" data-action="edit" data-i="'+i+'">ویرایش</button> '+
        '<button class="btn small danger deleteBtn" type="button" data-action="delete" data-i="'+i+'">حذف</button>'+
      "</td>";

    body.appendChild(tr);
  });
}

function openAdd(){
  editIndex = -1;
  currentImageData = "";
  $("productTitle").textContent = "افزودن محصول";
  $("nameInput").value = "";
  $("usdInput").value = "";
  $("imageInput").value = "";
  updateImagePreview("");
  openModal("productModal");
  setTimeout(()=>$("nameInput").focus(),50);
}

function openEdit(i){
  pendingEditIndex = i;
  $("passwordInput").value = "";
  openModal("passwordModal");
  setTimeout(()=>$("passwordInput").focus(),50);
}

function showEditForm(i){
  editIndex = i;
  currentImageData = products[i].image || "";
  $("productTitle").textContent = "ویرایش محصول";
  $("nameInput").value = products[i].name;
  $("usdInput").value = products[i].usd;
  $("imageInput").value = "";
  updateImagePreview(currentImageData);
  openModal("productModal");
  setTimeout(()=>$("nameInput").focus(),50);
}

$("addBtn").addEventListener("click", openAdd);

$("imageInput").addEventListener("change", e=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    currentImageData = String(ev.target.result || "");
    updateImagePreview(currentImageData);
  };
  reader.readAsDataURL(file);
});

$("saveProduct").addEventListener("click", ()=>{
  const name = $("nameInput").value.trim();
  const usd = Number($("usdInput").value);

  if(!name){ alert("نام محصول را وارد کنید."); return; }
  if(!Number.isFinite(usd) || usd < 0){ alert("قیمت دلار را درست وارد کنید."); return; }

  if(editIndex === -1){
    products.push({name, usd, image: currentImageData || ""});
  }else{
    products[editIndex] = {name, usd, image: currentImageData || ""};
  }

  saveProducts();
  render();
  closeModal("productModal");
});

$("tbody").addEventListener("click", e=>{
  const edit = e.target.closest(".editBtn");
  const del = e.target.closest(".deleteBtn");

  if(edit) openEdit(Number(edit.dataset.i));

  if(del){
    deleteIndex = Number(del.dataset.i);
    $("deleteMessage").textContent = "آیا محصول «"+products[deleteIndex].name+"» حذف شود؟";
    openModal("deleteModal");
  }
});

$("passwordOk").addEventListener("click", ()=>{
  const saved = localStorage.getItem(PASS_KEY) || DEFAULT_PASS;
  if($("passwordInput").value !== saved){
    alert("رمز عبور اشتباه است.");
    return;
  }
  closeModal("passwordModal");
  showEditForm(pendingEditIndex);
});

$("deleteOk").addEventListener("click", ()=>{
  if(deleteIndex >= 0){
    products.splice(deleteIndex,1);
    saveProducts();
    render();
  }
  deleteIndex = -1;
  closeModal("deleteModal");
});

$("settingsBtn").addEventListener("click", ()=>{
  $("oldPass").value = "";
  $("newPass").value = "";
  $("repeatPass").value = "";
  openModal("settingsModal");
  setTimeout(()=>$("oldPass").focus(),50);
});

$("changePass").addEventListener("click", ()=>{
  const saved = localStorage.getItem(PASS_KEY) || DEFAULT_PASS;
  const old = $("oldPass").value;
  const np = $("newPass").value;
  const rp = $("repeatPass").value;

  if(old !== saved){ alert("رمز فعلی اشتباه است."); return; }
  if(!np){ alert("رمز جدید را وارد کنید."); return; }
  if(np !== rp){ alert("تکرار رمز جدید یکسان نیست."); return; }

  localStorage.setItem(PASS_KEY,np);
  closeModal("settingsModal");
  alert("رمز ویرایش با موفقیت تغییر کرد.");
});

$("rate").value = localStorage.getItem(RATE_KEY) || DEFAULT_RATE;
$("rate").addEventListener("input", ()=>{
  localStorage.setItem(RATE_KEY, String(getRate()));
  render();
});

$("pdfBtn").addEventListener("click", ()=>{
  const popup = window.open("", "_blank");
  if(!popup){
    alert("باز شدن پنجره جدید توسط مرورگر مسدود شده است. اجازه Pop-up را برای سایت فعال کنید.");
    return;
  }

  const rate = getRate();
  const rows = products.map((p,i)=>{
    const price = Math.round(Number(p.usd) * rate);
    const imageCell = p.image
      ? '<img class="pdfThumb" src="'+p.image+'" alt="عکس محصول">'
