<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>

    <!-- پس‌زمینه -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1113"/>
      <stop offset="42%" stop-color="#1e2226"/>
      <stop offset="100%" stop-color="#34393f"/>
    </linearGradient>

    <!-- شیشه -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>

    <!-- نقره‌ای -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e9edf0"/>
      <stop offset="48%" stop-color="#a8afb6"/>
      <stop offset="72%" stop-color="#f7f8f9"/>
      <stop offset="100%" stop-color="#8d949b"/>
    </linearGradient>

    <!-- قرمز -->
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a81"/>
      <stop offset="30%" stop-color="#ee4e56"/>
      <stop offset="62%" stop-color="#c9252e"/>
      <stop offset="100%" stop-color="#7e161d"/>
    </linearGradient>

    <!-- قرمز براق -->
    <linearGradient id="redGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".46"/>
      <stop offset="25%" stop-color="#ff9ba0" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#d42b34" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#8b1920" stop-opacity="0"/>
    </linearGradient>

    <!-- هاله قرمز -->
    <radialGradient id="redGlow">
      <stop offset="0%" stop-color="#ff4b55" stop-opacity=".82"/>
      <stop offset="42%" stop-color="#db2831" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#db2831" stop-opacity="0"/>
    </radialGradient>

    <!-- هاله سفید -->
    <radialGradient id="whiteGlow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- سایه سه‌بعدی -->
    <filter id="deepShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity=".52"/>
    </filter>

    <!-- سایه نرم -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".34"/>
    </filter>

    <!-- Glow -->
    <filter id="redBlur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="whiteBlur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

  </defs>

  <!-- پس‌زمینه اصلی -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- هاله‌های محیطی -->
  <circle
    cx="266"
    cy="255"
    r="185"
    fill="url(#redGlow)"
    filter="url(#redBlur)"
  />

  <ellipse
    cx="160"
    cy="120"
    rx="125"
    ry="88"
    fill="url(#whiteGlow)"
    filter="url(#whiteBlur)"
  />

  <!-- لایه شیشه بیرونی -->
  <g filter="url(#deepShadow)">
    <rect
      x="30"
      y="30"
      width="452"
      height="452"
      rx="112"
      fill="url(#glass)"
      stroke="#ffffff"
      stroke-opacity=".28"
      stroke-width="4"
    />

    <rect
      x="48"
      y="48"
      width="416"
      height="416"
      rx="96"
      fill="none"
      stroke="#ffffff"
      stroke-opacity=".10"
      stroke-width="2"
    />
  </g>

  <!-- انعکاس شیشه بالا -->
  <path
    d="
      M66 88
      C130 47 215 39 294 50
      C359 58 413 83 449 125
      L449 157
      C396 119 340 101 281 94
      C201 85 131 96 66 134
      Z
    "
    fill="#ffffff"
    fill-opacity=".08"
  />

  <!-- هاله قرمز داخلی -->
  <circle
    cx="256"
    cy="250"
    r="148"
    fill="url(#redGlow)"
    opacity=".46"
  />

  <!-- بدنه سه‌بعدی نماد -->
  <g filter="url(#softShadow)">

    <!-- صفحه شیشه مرکزی -->
    <circle
      cx="256"
      cy="250"
      r="144"
      fill="#111417"
      fill-opacity=".72"
      stroke="#ffffff"
      stroke-opacity=".08"
      stroke-width="2"
    />

    <!-- حلقه ضخیم نقره‌ای -->
    <circle
      cx="256"
      cy="250"
      r="128"
      fill="none"
      stroke="url(#silver)"
      stroke-width="22"
    />

    <!-- سایه داخلی حلقه -->
    <circle
      cx="256"
      cy="250"
      r="111"
      fill="none"
      stroke="#000000"
      stroke-opacity=".30"
      stroke-width="5"
    />

  </g>

  <!-- حلقه قرمز سه‌بعدی -->
  <path
    d="
      M169 342
      A128 128 0 0 1 347 154
    "
    fill="none"
    stroke="url(#red)"
    stroke-width="22"
    stroke-linecap="round"
    filter="url(#softShadow)"
  />

  <!-- برق بزرگ -->
  <g filter="url(#deepShadow)">

    <path
      d="
        M286 106
        L208 246
        H261
        L220 386
        L337 222
        H278
        Z
      "
      fill="url(#red)"
      stroke="#ffd8db"
      stroke-opacity=".26"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <!-- برق براق روی برق اصلی -->
    <path
      d="
        M286 106
        L226 226
        H264
        L244 293
        L302 214
        H275
        Z
      "
      fill="url(#redGloss)"
      opacity=".78"
    />

  </g>

  <!-- Glow پشت برق -->
  <path
    d="
      M286 106
      L208 246
      H261
      L220 386
      L337 222
      H278
      Z
    "
    fill="#ff3943"
    opacity=".18"
    filter="url(#redBlur)"
  />

  <!-- انعکاس نور روی حلقه -->
  <path
    d="
      M177 171
      C214 128 276 112 332 130
      C349 136 364 143 378 154
    "
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".36"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- نقاط مدار -->
  <g filter="url(#softShadow)">
    <circle cx="154" cy="250" r="9" fill="url(#silver)"/>
    <circle cx="358" cy="250" r="9" fill="url(#silver)"/>
    <circle cx="256" cy="106" r="9" fill="url(#silver)"/>
    <circle cx="256" cy="394" r="9" fill="url(#silver)"/>
  </g>

  <!-- نقاط نور قرمز کوچک -->
  <circle cx="188" cy="333" r="5" fill="#ff5a62"/>
  <circle cx="337" cy="174" r="5" fill="#ff5a62"/>

  <!-- بازتاب شیشه داخلی -->
  <ellipse
    cx="213"
    cy="171"
    rx="77"
    ry="34"
    transform="rotate(-18 213 171)"
    fill="#ffffff"
    fill-opacity=".08"
  />

  <!-- خط نور ظریف پایین -->
  <path
    d="
      M112 416
      C178 442 334 442 400 416
    "
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".08"
    stroke-width="3"
    stroke-linecap="round"
  />

</svg>
